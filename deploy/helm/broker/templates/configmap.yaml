apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "broker.fullname" . }}
  labels:
    {{- include "broker.labels" . | nindent 4 }}
data:
  HTTP_ADDR: ":8080"
  KAFKA_BROKERS: {{ .Values.config.kafkaBrokers | quote }}
  KAFKA_TOPIC: {{ .Values.config.kafkaTopic | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
