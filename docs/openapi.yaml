openapi: 3.1.0
info:
  title: tradebench sandbox broker API
  version: 0.1.0
  description: |
    Sandbox brokerage API used as the system under test.

    Conventions:
    - Money is a string with exactly two decimals ("1234.50"). Quantities are
      whole-number strings ("10"). JSON numbers are rejected with 400.
    - Request bodies are strict: unknown fields, trailing data or an empty body
      return 400 `invalid_json`.
    - Nullable response fields are always present (null when empty).
    - Errors use the `Error` schema. 422 `validation_error` names the field.
    - Every order state change emits a `TradeUpdate` to the Kafka topic
      `trade-updates`, keyed by account id (transactional outbox,
      at-least-once).
servers:
  - url: http://localhost:8080
security:
  - bearer: []

paths:
  /healthz:
    get:
      summary: Liveness
      security: []
      responses:
        "200": { description: Process is up }
  /readyz:
    get:
      summary: Readiness (database reachable)
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }

  /v1/accounts:
    post:
      summary: Open an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [owner_name]
              properties:
                owner_name: { type: string, minLength: 1, maxLength: 100, description: Trimmed before validation }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }

  /v1/accounts/{id}:
    parameters: [{ $ref: "#/components/parameters/AccountID" }]
    get:
      summary: Get an account
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Close an account (cancels open orders). Idempotent.
      responses:
        "204": { description: Closed }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/accounts/{id}/deposits:
    parameters: [{ $ref: "#/components/parameters/AccountID" }]
    post:
      summary: Deposit cash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount]
              properties:
                amount: { $ref: "#/components/schemas/Money", description: "0.01 .. 1000000.00" }
      responses:
        "200": { description: Updated account, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /v1/accounts/{id}/orders:
    parameters: [{ $ref: "#/components/parameters/AccountID" }]
    post:
      summary: Place an order
      description: |
        Market orders and marketable limit orders fill immediately at the
        current price. Non-marketable limit orders rest with status `new`;
        a buy reserves limit_price x qty of buying power. Resting orders fill
        when PUT /v1/market/prices/{symbol} crosses the limit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderRequest" }
      responses:
        "201": { description: Accepted (status new or filled), content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "403":
          description: insufficient_buying_power | insufficient_qty | account_not_active
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: duplicate_client_order_id
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: validation_error | unknown_symbol
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    get:
      summary: List orders, newest first
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, closed, all], default: open }
      responses:
        "200":
          description: OK (empty list is [])
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Order" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /v1/accounts/{id}/orders/{order_id}:
    parameters:
      - { $ref: "#/components/parameters/AccountID" }
      - { name: order_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get an order
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Cancel an open order (releases reserved buying power)
      responses:
        "204": { description: Canceled }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: order_not_cancelable (already filled or canceled)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/accounts/{id}/positions:
    parameters: [{ $ref: "#/components/parameters/AccountID" }]
    get:
      summary: List positions
      responses:
        "200":
          description: OK (empty list is [])
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Position" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/accounts/{id}/positions/{symbol}:
    parameters:
      - { $ref: "#/components/parameters/AccountID" }
      - { name: symbol, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a position
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Position" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/market/prices/{symbol}:
    parameters:
      - { name: symbol, in: path, required: true, schema: { type: string, pattern: "^[A-Z]{1,10}$" } }
    get:
      summary: Current sandbox price
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Price" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Set (or create) a sandbox price; fills crossed limit orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [price]
              properties:
                price: { $ref: "#/components/schemas/Money" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Price" } } } }
        "422": { $ref: "#/components/responses/Validation" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }

  parameters:
    AccountID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }

  responses:
    InvalidJSON: { description: invalid_json, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: account_not_active, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: "*_not_found", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Validation: { description: validation_error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  schemas:
    Money: { type: string, pattern: "^(0|[1-9][0-9]*)\\.[0-9]{2}$", examples: ["190.00"] }
    SignedMoney: { type: string, pattern: "^-?(0|[1-9][0-9]*)\\.[0-9]{2}$" }
    Qty: { type: string, pattern: "^(0|[1-9][0-9]*)$", examples: ["10"] }

    Account:
      type: object
      additionalProperties: false
      required: [id, owner_name, status, currency, cash, buying_power, created_at]
      properties:
        id: { type: string, format: uuid }
        owner_name: { type: string }
        status: { type: string, enum: [active, closed] }
        currency: { type: string, enum: [USD] }
        cash: { $ref: "#/components/schemas/Money" }
        buying_power: { $ref: "#/components/schemas/Money", description: cash minus cash reserved by open buy limit orders }
        created_at: { type: string, format: date-time }

    OrderRequest:
      type: object
      additionalProperties: false
      required: [symbol, side, type, qty]
      properties:
        symbol: { type: string, pattern: "^[A-Z]{1,10}$" }
        side: { type: string, enum: [buy, sell] }
        type: { type: string, enum: [market, limit] }
        qty: { $ref: "#/components/schemas/Qty", description: "1 .. 1000000" }
        limit_price: { $ref: "#/components/schemas/Money", description: required for limit, forbidden for market }
        client_order_id: { type: string, maxLength: 48, description: unique per account; defaults to the order id }

    Order:
      type: object
      additionalProperties: false
      required: [id, client_order_id, account_id, symbol, side, type, qty, limit_price, status, filled_qty,
                 filled_avg_price, created_at, updated_at, filled_at, canceled_at]
      properties:
        id: { type: string, format: uuid }
        client_order_id: { type: string }
        account_id: { type: string, format: uuid }
        symbol: { type: string }
        side: { type: string, enum: [buy, sell] }
        type: { type: string, enum: [market, limit] }
        qty: { $ref: "#/components/schemas/Qty" }
        limit_price: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        status: { type: string, enum: [new, filled, canceled] }
        filled_qty: { $ref: "#/components/schemas/Qty" }
        filled_avg_price: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        filled_at: { type: [string, "null"], format: date-time }
        canceled_at: { type: [string, "null"], format: date-time }

    Position:
      type: object
      additionalProperties: false
      required: [symbol, qty, avg_entry_price, cost_basis, current_price, market_value, unrealized_pl]
      properties:
        symbol: { type: string }
        qty: { $ref: "#/components/schemas/Qty" }
        avg_entry_price: { $ref: "#/components/schemas/Money", description: quantity-weighted, rounded half up to the cent }
        cost_basis: { $ref: "#/components/schemas/Money" }
        current_price: { $ref: "#/components/schemas/Money" }
        market_value: { $ref: "#/components/schemas/Money" }
        unrealized_pl: { $ref: "#/components/schemas/SignedMoney" }

    Price:
      type: object
      additionalProperties: false
      required: [symbol, price, updated_at]
      properties:
        symbol: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        updated_at: { type: string, format: date-time }

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, examples: [insufficient_buying_power] }
        message: { type: string }
        field: { type: string, description: present on validation errors }

    TradeUpdate:
      description: Kafka event on topic trade-updates, record key = account_id
      type: object
      additionalProperties: false
      required: [event, timestamp, order]
      properties:
        event: { type: string, enum: [new, fill, canceled] }
        timestamp: { type: string, format: date-time }
        price: { $ref: "#/components/schemas/Money", description: fill only }
        qty: { $ref: "#/components/schemas/Qty", description: fill only }
        order: { $ref: "#/components/schemas/Order" }
